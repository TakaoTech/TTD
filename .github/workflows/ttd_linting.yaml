name: 'Lint Check'
on:
  push: { }
  pull_request:
    types:
      - 'ready_for_review'
      - 'review_requested'
jobs:
  lint:
    runs-on: 'ubuntu-latest'
    steps:
      - id: 'step-0'
        name: 'Setup Java'
        uses: 'actions/setup-java@v4'
        with:
          java-version: '17'
          distribution: 'corretto'
      - id: 'step-1'
        name: 'Checkout'
        uses: 'actions/checkout@v4'
      - id: 'step-2'
        name: 'Lint Fix'
        run: './gradlew ktlintFormat'
      - id: 'step-3'
        name: 'Commit format'
        uses: 'stefanzweifel/git-auto-commit-action@v5'
        with:
          commit_message: 'Lint formatting'
