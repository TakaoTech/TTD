name: 'Server build workflow'
on:
  push:
    branches:
    - 'test'
jobs:
  build_server:
    runs-on: 'ubuntu-latest'
    steps:
    - id: 'step-0'
      name: 'Setup Java'
      uses: 'actions/setup-java@v4'
      with:
        java-version: '17'
        distribution: 'corretto'
    - id: 'step-1'
      name: 'Set up Docker Buildx'
      uses: 'docker/setup-buildx-action@v3'
    - id: 'step-2'
      name: 'Setup Android SDK'
      uses: 'android-actions/setup-android@v3'
    - id: 'step-3'
      name: 'Setup Gradle'
      uses: 'gradle/actions/setup-gradle@v3'
    - id: 'step-4'
      name: 'Checkout'
      uses: 'actions/checkout@v4'
    - id: 'step-5'
      name: 'Write Keystore on disk'
      run: 'echo ${{ secrets.KEYSTORE_BASE64_SECRET }} > TTD-App-Keystore.base64.txt | base64 -di TTD-App-Keystore.base64.txt > TTD-App-Keystore.jks'
    - id: 'step-6'
      name: 'Write Google login JSON to disk'
      run: 'echo ${{ secrets.GOOGLE_LOGIN_JSON_BASE64 }} | base64 -di > composeApp/src/androidMain/${{ secrets.GOOGLE_LOGIN_JSON_NAME }}'
    - id: 'step-7'
      name: 'Login to DockerHub'
      uses: 'docker/login-action@v3'
      with:
        username: '${{ vars.DOCKER_HUB_USERNAME }}'
        password: '${{ secrets.DOCKER_HUB_TOKEN }}'
    - id: 'step-8'
      name: 'Generate Image'
      uses: 'docker/build-push-action@v5'
      with:
        file: './Dockerfile'
        platforms: 'linux/amd64'
        push: 'true'
        tags: 'samuele794/ttd:test'
